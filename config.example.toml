# Copy this file to config.toml and fill in your own values.
# config.toml is git-ignored: never commit credentials.

[sports_feed]
# HTTP endpoint polled for live state. No provider is assumed: point this at
# whichever feed you are evaluating and let the recording measure its lag.
#
# The example below is a free scoreboard endpoint, useful for checking the
# plumbing. Measure its update cadence before trusting it: a source that only
# changes every ten seconds cannot beat a market that reprices in seconds, no
# matter how fast you poll it.
url = "https://site.api.espn.com/apis/site/v2/sports/soccer/ita.1/scoreboard"
# How often to poll. Faster than the source updates buys nothing and risks
# being rate limited; minimum 100 ms.
poll_interval_ms = 1000
timeout_ms = 5000
# Write a heartbeat line after this many unchanged polls, so a quiet recording
# is never mistaken for a dead one. Zero disables it.
heartbeat_polls = 60

# Sent with every request. This is where a paid feed authenticates. Values are
# credentials: they are never written to the recording metadata.
# [sports_feed.headers]
# "x-api-key" = "YOUR_API_KEY_HERE"

[polymarket]
# Public CLOB endpoints. The market channel needs no credentials.
ws_url = "wss://ws-subscriptions-clob.polymarket.com/ws/market"
rest_url = "https://clob.polymarket.com"
# Outcome token ids to record. These are the `assets_ids` of the market
# channel, not condition ids. Find them in `clobTokenIds` on the Gamma
# markets API, for example:
#   https://gamma-api.polymarket.com/markets?closed=false&limit=5
asset_ids = []
# The market channel expects a PING text frame on this interval.
ping_interval_secs = 10
# Required only in live mode. Leave empty for paper mode.
api_key = ""
api_secret = ""
api_passphrase = ""

[recording]
# Where recordings and their metadata sidecars are written. Git-ignored.
output_dir = "data/recordings"
# Frames buffered between the socket and the writer. A full queue stalls the
# read loop, which skews every later timestamp, so stalls are counted and
# reported rather than hidden.
queue_capacity = 65536
# How often to log a progress line while recording.
stats_interval_secs = 60

[decision]
# Minimum edge, in probability points, required before sending an order.
# Must cover fees + half-spread + a safety margin.
min_edge = 0.03
# Hard cap on exposure per market, in USDC.
max_position = 50.0
# Abandon a signal older than this: a stale event is not an edge.
max_signal_age_ms = 250

[execution]
# "paper" simulates fills and sends nothing. "live" sends real orders.
mode = "paper"
# Drop an order rather than chase the book beyond this many ticks.
max_slippage_ticks = 2

[metrics]
# Where latency histograms and simulated PnL are written.
output_dir = "data/metrics"
# Log a percentile summary at this interval.
summary_interval_secs = 60
