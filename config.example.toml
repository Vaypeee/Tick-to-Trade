# Copy this file to config.toml and fill in your own values.
# config.toml is git-ignored: never commit credentials.

# Candidate sports feeds. Several can be listed and recorded side by side,
# because which one to trust is a measurement rather than a choice made from
# vendor claims — `compare` ranks them by what they actually showed first.
#
# The name goes into the recording filename, so two candidates recorded over
# the same window stay apart. Record one per process:
#   record --feed sports --source espn &
#   record --feed sports --source vendor &
[[sports_feeds]]
name = "espn"
url = "https://site.api.espn.com/apis/site/v2/sports/soccer/ita.1/scoreboard"
# How often to poll. Faster than the source updates buys nothing and risks
# being rate limited; minimum 100 ms.
poll_interval_ms = 1000
timeout_ms = 5000
# Write a heartbeat line after this many unchanged polls, so a quiet recording
# is never mistaken for a dead one. Zero disables it.
heartbeat_polls = 60

# A second candidate, for comparison. Sent headers are where a paid feed
# authenticates; their values are credentials and never reach the metadata.
# [[sports_feeds]]
# name = "vendor"
# url = "https://example-provider.invalid/v1/live"
# poll_interval_ms = 500
# [sports_feeds.headers]
# "x-api-key" = "YOUR_API_KEY_HERE"

[polymarket]
# Public CLOB endpoints. The market channel needs no credentials.
ws_url = "wss://ws-subscriptions-clob.polymarket.com/ws/market"
rest_url = "https://clob.polymarket.com"
# Outcome token ids to record. These are the `assets_ids` of the market
# channel, not condition ids. Find them in `clobTokenIds` on the Gamma
# markets API, for example:
#   https://gamma-api.polymarket.com/markets?closed=false&limit=5
#
# List EVERY outcome of a market, not just the side you care about. The
# channel pushes price changes for all of them, but it only sends an opening
# snapshot for the ones subscribed to, and a book cannot be rebuilt from
# deltas alone. Subscribe to one side of a binary market and half the deltas
# arrive with nothing to apply them to.
asset_ids = []
# The market channel expects a PING text frame on this interval.
ping_interval_secs = 10
# Required only in live mode. Leave empty for paper mode.
api_key = ""
api_secret = ""
api_passphrase = ""

[recording]
# Where recordings and their metadata sidecars are written. Git-ignored.
output_dir = "data/recordings"
# Frames buffered between the socket and the writer. A full queue stalls the
# read loop, which skews every later timestamp, so stalls are counted and
# reported rather than hidden.
queue_capacity = 65536
# How often to log a progress line while recording.
stats_interval_secs = 60

[decision]
# Edge required BEYOND the round trip cost, in probability points. The cost
# itself — a full spread crossed twice, plus fees on both legs — is computed
# from the book, so this is the margin on top of it.
min_edge = 0.03
# Hard cap on exposure, in units.
max_position = 50.0
# Units per entry.
size = 10.0
# Refuse a book wider than this. Crossing it costs more than it is worth.
max_spread = 0.05
# Refuse when the touch cannot absorb the whole order. Walking the book is a
# different, worse trade than the one that was evaluated.
require_touch_depth = true
# Abandon a signal older than this: a stale event is not an edge.
max_signal_age_ms = 250

[execution]
# "paper" simulates fills and sends nothing. "live" sends real orders and is
# not implemented.
mode = "paper"
# Taker fee on each leg, in basis points of notional. Leave at zero only if
# the venue genuinely takes nothing.
fee_bps = 0.0
# Drop an order rather than chase the book beyond this many ticks.
max_slippage_ticks = 2

[metrics]
# Where latency histograms and simulated PnL are written.
output_dir = "data/metrics"
# Log a percentile summary at this interval.
summary_interval_secs = 60

# The spectator baseline. Press these as you watch the public broadcast: each
# press records when a viewer with no advantage could have known. `direction`
# says which way the event should push the FIRST entry of
# `polymarket.asset_ids`, so the analysis can tell a market move that agrees
# with the event from one that does not.
[labels]
# Loopback only. The page is unauthenticated and its presses are written to
# disk, so anything else is refused.
bind = "127.0.0.1:7878"

[[labels.buttons]]
id = "blue_fight"
text = "Blue won the teamfight"
key = "q"
direction = "up"

[[labels.buttons]]
id = "red_fight"
text = "Red won the teamfight"
key = "w"
direction = "down"

[[labels.buttons]]
id = "blue_pick"
text = "Blue got a pick"
key = "e"
direction = "up"

[[labels.buttons]]
id = "red_pick"
text = "Red got a pick"
key = "r"
direction = "down"

[[labels.buttons]]
id = "blue_objective"
text = "Blue took an objective"
key = "a"
direction = "up"

[[labels.buttons]]
id = "red_objective"
