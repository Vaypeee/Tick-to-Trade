[package]
name = "tick-to-trade"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Low-latency event-driven inference pipeline for live sports prediction markets"
license = "MIT"
readme = "README.md"
publish = false

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std", "sink"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "gzip", "charset"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "io-util", "fs", "net"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
# Latency work: keep the optimiser aggressive and the panics cheap.
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = 1
