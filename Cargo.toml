[package]
name = "tick-to-trade"
version = "0.1.0"
edition = "2024"
# Verified by CI rather than asserted: the code uses let-chains, which need
# 1.88, and an unchecked `rust-version` is a number somebody typed once.
rust-version = "1.88"
description = "Low-latency event-driven inference pipeline for live sports prediction markets"
license = "MIT"
readme = "README.md"
publish = false
# Three binaries ship from this crate, so a bare `cargo run` needs to be told
# which one it means. The pipeline entry point is the one the README runs.
default-run = "tick-to-trade"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std", "sink"] }
hdrhistogram = { version = "7.5.4", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "gzip", "charset"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "io-util", "fs", "net"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
# Latency work: keep the optimiser aggressive and the panics cheap.
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = 1
