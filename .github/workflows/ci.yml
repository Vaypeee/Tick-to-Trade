name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # A warning that only fails on one machine is a warning nobody fixes.
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: format, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Lints
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --all-targets

      # Nothing here reaches the network: every test runs against fixtures or
      # hand-built inputs, which is what makes them worth running on a machine
      # that has never seen a live market.
      - name: Release build
        run: cargo build --release

  minimum-rust:
    name: minimum supported Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `rust-version` in Cargo.toml is a promise. Without a job that keeps
      # it, it is a number somebody typed once and nobody checked again.
      - name: Read the declared minimum
        id: msrv
        run: |
          version=$(grep '^rust-version' Cargo.toml | cut -d'"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Cargo.toml declares $version"

      - name: Install it
        run: rustup toolchain install ${{ steps.msrv.outputs.version }} --profile minimal

      - uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo +${{ steps.msrv.outputs.version }} check --all-targets
