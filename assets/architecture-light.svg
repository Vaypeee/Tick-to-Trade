<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="1000" height="450" role="img" aria-label="Three feeds are recorded to disk with two clocks each. A replay rebuilds the order book from the recordings and feeds the analysis, the paper trader and the dashboard. The live trading pipeline is drawn dashed because it has not been built.">
  <title>Tick to trade — what runs, and what does not</title>
  <desc>Sports feed, Polymarket order book and a spectator pressing keys are each captured by a recorder into timestamped JSON Lines. A replay rebuilds the book from those files and drives the analysis, the paper trader and the dashboard. Inference, decision and execution are drawn dashed: they are not built, because the measurement has not justified building them.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#656d76"/>
    </marker>
    <marker id="arrow-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0969da"/>
    </marker>
  </defs>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">

    <!-- sources -->
    <rect x="14" y="36" width="152" height="42" rx="6" fill="#ffffff" stroke="#afb8c1"/>
    <text x="90" y="56" text-anchor="middle" font-size="12" fill="#1f2328">Live sports feed</text>
    <text x="90" y="70" text-anchor="middle" font-size="9.5" fill="#656d76">http, polled</text>

    <rect x="14" y="98" width="152" height="42" rx="6" fill="#ffffff" stroke="#afb8c1"/>
    <text x="90" y="118" text-anchor="middle" font-size="12" fill="#1f2328">Polymarket CLOB</text>
    <text x="90" y="132" text-anchor="middle" font-size="9.5" fill="#656d76">websocket, public</text>

    <rect x="14" y="160" width="152" height="42" rx="6" fill="#ffffff" stroke="#afb8c1"/>
    <text x="90" y="180" text-anchor="middle" font-size="12" fill="#1f2328">You, on the stream</text>
    <text x="90" y="194" text-anchor="middle" font-size="9.5" fill="#656d76">keys, no advantage</text>

    <!-- recorders -->
    <rect x="212" y="36" width="156" height="42" rx="6" fill="#ffffff" stroke="#afb8c1"/>
    <text x="290" y="62" text-anchor="middle" font-size="11.5" fill="#1f2328">record --feed sports</text>

    <rect x="212" y="98" width="156" height="42" rx="6" fill="#ffffff" stroke="#afb8c1"/>
    <text x="290" y="124" text-anchor="middle" font-size="11.5" fill="#1f2328">record --feed polymarket</text>

    <rect x="212" y="160" width="156" height="42" rx="6" fill="#ffffff" stroke="#afb8c1"/>
    <text x="290" y="186" text-anchor="middle" font-size="11.5" fill="#1f2328">record --feed labels</text>

    <!-- store -->
    <rect x="414" y="80" width="146" height="78" rx="6" fill="#f6f8fa" stroke="#0969da"/>
    <text x="487" y="106" text-anchor="middle" font-size="12" fill="#1f2328">Recordings</text>
    <text x="487" y="122" text-anchor="middle" font-size="9.5" fill="#656d76">JSON Lines, verbatim</text>
    <text x="487" y="136" text-anchor="middle" font-size="9.5" fill="#656d76">wall + monotonic clocks</text>

    <!-- replay -->
    <rect x="606" y="98" width="146" height="42" rx="6" fill="#ffffff" stroke="#afb8c1"/>
    <text x="679" y="118" text-anchor="middle" font-size="12" fill="#1f2328">Replay</text>
    <text x="679" y="132" text-anchor="middle" font-size="9.5" fill="#656d76">rebuilds the book</text>

    <!-- outputs -->
    <rect x="798" y="36" width="188" height="42" rx="6" fill="#ffffff" stroke="#afb8c1"/>
    <text x="892" y="56" text-anchor="middle" font-size="11.5" fill="#1f2328">analyse</text>
    <text x="892" y="70" text-anchor="middle" font-size="9.5" fill="#656d76">lead, flow, edge vs latency</text>

    <rect x="798" y="98" width="188" height="42" rx="6" fill="#ffffff" stroke="#afb8c1"/>
    <text x="892" y="118" text-anchor="middle" font-size="11.5" fill="#1f2328">paper</text>
    <text x="892" y="132" text-anchor="middle" font-size="9.5" fill="#656d76">rules, costs, break-even</text>

    <rect x="798" y="160" width="188" height="42" rx="6" fill="#ffffff" stroke="#afb8c1"/>
    <text x="892" y="180" text-anchor="middle" font-size="11.5" fill="#1f2328">dashboard</text>
    <text x="892" y="194" text-anchor="middle" font-size="9.5" fill="#656d76">one timeline</text>

    <!-- arrows: sources to recorders -->
    <g stroke="#656d76" stroke-width="1.3" fill="none" marker-end="url(#arrow)">
      <line x1="166" y1="57" x2="206" y2="57"/>
      <line x1="166" y1="181" x2="206" y2="181"/>
    </g>
    <g stroke="#0969da" stroke-width="1.6" fill="none" marker-end="url(#arrow-hot)">
      <line x1="166" y1="119" x2="206" y2="119"/>
    </g>

    <!-- arrows: recorders into the store -->
    <g stroke="#656d76" stroke-width="1.3" fill="none" marker-end="url(#arrow)">
      <path d="M368,57 L392,57 L392,100 L408,100"/>
      <path d="M368,181 L392,181 L392,138 L408,138"/>
    </g>
    <g stroke="#0969da" stroke-width="1.6" fill="none" marker-end="url(#arrow-hot)">
      <line x1="368" y1="119" x2="408" y2="119"/>
    </g>

    <!-- store to replay, replay to outputs -->
    <g stroke="#0969da" stroke-width="1.6" fill="none" marker-end="url(#arrow-hot)">
      <line x1="560" y1="119" x2="600" y2="119"/>
      <path d="M752,119 L776,119 L776,57 L792,57"/>
      <line x1="752" y1="119" x2="792" y2="119"/>
      <path d="M752,119 L776,119 L776,181 L792,181"/>
    </g>

    <!-- not built -->
    <rect x="212" y="268" width="774" height="104" rx="10" fill="none" stroke="#d0d7de" stroke-width="1" stroke-dasharray="6 5"/>
    <text x="232" y="292" font-size="11" fill="#656d76">Live pipeline — not built</text>

    <rect x="236" y="304" width="150" height="40" rx="6" fill="none" stroke="#d0d7de" stroke-dasharray="4 4"/>
    <text x="311" y="329" text-anchor="middle" font-size="11.5" fill="#656d76">Inference</text>

    <rect x="428" y="304" width="150" height="40" rx="6" fill="none" stroke="#d0d7de" stroke-dasharray="4 4"/>
    <text x="503" y="329" text-anchor="middle" font-size="11.5" fill="#656d76">Decision</text>

    <rect x="620" y="304" width="150" height="40" rx="6" fill="none" stroke="#d0d7de" stroke-dasharray="4 4"/>
    <text x="695" y="329" text-anchor="middle" font-size="11.5" fill="#656d76">Execution</text>

    <rect x="812" y="304" width="150" height="40" rx="6" fill="none" stroke="#d0d7de" stroke-dasharray="4 4"/>
    <text x="887" y="329" text-anchor="middle" font-size="11.5" fill="#656d76">CLOB</text>

    <g stroke="#d0d7de" stroke-width="1.2" fill="none" stroke-dasharray="4 4">
      <line x1="386" y1="324" x2="424" y2="324"/>
      <line x1="578" y1="324" x2="616" y2="324"/>
      <line x1="770" y1="324" x2="808" y2="324"/>
    </g>

    <text x="212" y="398" font-size="10.5" fill="#656d76">The decision rules exist and are tested offline; nothing sends an order. The rest waits until the measurement says it is worth building.</text>
    <text x="14" y="424" font-size="10.5" fill="#0969da">Blue is the path that runs today: record the book, replay it, measure against a spectator who had no advantage.</text>

  </g>
</svg>
